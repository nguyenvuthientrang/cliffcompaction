[project]
name = "cliffcompaction"
version = "0.1.0"
description = "CliffCompaction — context compaction for coding agents, as a transparent API proxy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.scripts]
cliff = "cliffcompaction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cliffcompaction"]

# Allowlist, not a denylist: an sdist is public and permanent, so nothing ships
# unless it is named here.
[tool.hatch.build.targets.sdist]
include = [
    "src/cliffcompaction",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
